<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейное древо</title>
<style>
  :root{
    --sky-top:#bfe3f2;
    --sky-bottom:#eaf7e6;
    --grass-top:#9fd88a;
    --grass-bottom:#6fae57;
    --ink:#3a3226;
    --paper:#fffdf7;
    --accent:#7a5a3a;
    --accent-dark:#5c4128;
    --danger:#b5533c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Georgia','Times New Roman',serif;color:var(--ink);overflow:hidden;background:#000;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    background:var(--paper);
    border-bottom:1px solid #d8cdb8;
    z-index:50;
    flex-wrap:wrap;
  }
  #topbar h1{font-size:16px;margin:0 10px 0 4px;font-weight:600;color:var(--accent-dark);white-space:nowrap;}
  .btn{
    font-family:inherit;
    font-size:13px;
    padding:7px 12px;
    border-radius:8px;
    border:1px solid #c9bb9d;
    background:#fffaf0;
    color:var(--accent-dark);
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
  .btn.danger{background:#fff0ec;border-color:var(--danger);color:var(--danger);}
  .spacer{flex:1;}

  /* ---------- canvas / scene ---------- */
  #scene-wrap{
    flex:1;position:relative;overflow:auto;
    background:linear-gradient(var(--sky-top), var(--sky-bottom) 55%, var(--grass-top) 55%, var(--grass-bottom) 100%);
    touch-action: pan-x pan-y;
  }
  #zoomControls{
    position:fixed;right:14px;bottom:18px;z-index:60;
    display:flex;flex-direction:column;gap:8px;
  }
  #zoomControls button{
    width:42px;height:42px;border-radius:50%;border:1px solid #c9bb9d;
    background:#fffaf0ee;color:var(--accent-dark);font-size:20px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  #sun{
    position:absolute;top:36px;right:60px;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d0, #ffe9a3 55%, #ffd97a 100%);
    box-shadow:0 0 40px 12px rgba(255,230,150,0.55);
  }
  .cloud{position:absolute;opacity:.85;}
  #scene{position:relative;}
  svg#tree-svg{display:block;overflow:visible;}
  .node-img{cursor:pointer;}
  .node-label{
    font-family:'Georgia',serif;
    fill:var(--accent-dark);
    font-size:13px;
    text-anchor:middle;
    paint-order:stroke;
    stroke:#fffdf7cc;
    stroke-width:3px;
    cursor:pointer;
    user-select:none;
  }
  .node-label.leaf-label{font-size:12px;fill:#3a5c2c;}
  .conn-line{fill:none;stroke:#5c4a34;stroke-width:2;opacity:.55;stroke-linecap:round;}
  .empty-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:20px;
  }
  .empty-hint p{max-width:320px;color:#3a5c2c;font-size:15px;line-height:1.5;background:#ffffffcc;padding:14px 18px;border-radius:12px;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(30,25,15,0.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:200;
  }
  @media(min-width:640px){
    .modal-backdrop{align-items:center;}
  }
  .modal{
    background:var(--paper);
    width:100%;max-width:520px;
    max-height:92vh;
    border-radius:16px 16px 0 0;
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 -4px 30px rgba(0,0,0,0.3);
  }
  @media(min-width:640px){
    .modal{border-radius:16px;max-height:85vh;}
  }
  .modal-header{
    padding:14px 16px;border-bottom:1px solid #e3d8c0;
    display:flex;align-items:center;gap:10px;
  }
  .modal-header h2{font-size:17px;margin:0;flex:1;color:var(--accent-dark);}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#8a7a5c;padding:2px 6px;}
  .tabs{display:flex;overflow-x:auto;border-bottom:1px solid #e3d8c0;background:#fbf5e6;}
  .tab-btn{
    font-family:inherit;font-size:13px;padding:10px 12px;background:none;border:none;
    border-bottom:2px solid transparent;color:#8a7a5c;cursor:pointer;white-space:nowrap;
  }
  .tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:600;}
  .modal-body{padding:16px;overflow-y:auto;flex:1;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:#7a6a4c;margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%;font-family:inherit;font-size:15px;padding:9px 10px;
    border:1px solid #cbbb98;border-radius:8px;background:#fffefb;color:var(--ink);
  }
  .field textarea{min-height:70px;resize:vertical;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .list-item{
    border:1px solid #e3d8c0;border-radius:10px;padding:10px 12px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;background:#fffefb;
  }
  .list-item .info{flex:1;}
  .list-item .name{font-weight:600;font-size:14px;}
  .list-item .sub{font-size:12px;color:#8a7a5c;}
  .mini-btn{
    font-family:inherit;font-size:12px;padding:5px 9px;border-radius:6px;
    border:1px solid #c9bb9d;background:#fff;color:var(--accent-dark);cursor:pointer;
  }
  .memory-item{border-left:3px solid var(--accent);padding:8px 10px;margin-bottom:10px;background:#fbf5e6;border-radius:0 8px 8px 0;}
  .memory-item .meta{font-size:11px;color:#8a7a5c;margin-bottom:4px;}
  .memory-item .text{font-size:14px;line-height:1.4;white-space:pre-wrap;}
  .footer-actions{padding:12px 16px;border-top:1px solid #e3d8c0;display:flex;gap:10px;}
  .footer-actions .btn{flex:1;}
  .hint-text{font-size:12px;color:#8a7a5c;margin:4px 0 12px;line-height:1.4;}
  .unknown-badge{display:inline-block;background:#e9dfc8;color:#7a6a4c;border-radius:6px;padding:2px 6px;font-size:11px;margin-left:6px;}
  .placeholder-msg{font-size:13px;color:#8a7a5c;text-align:center;padding:20px 10px;}
  #fileInput{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>🌳 Семейное древо</h1>
    <button class="btn primary" id="btnAddRoot" style="display:none;">Создать древо</button>
    <button class="btn" id="btnExport">Экспорт</button>
    <button class="btn" id="btnImport">Импорт / Объединить</button>
    <div class="spacer"></div>
  </div>
  <div id="scene-wrap">
    <div id="sun"></div>
    <div id="scene">
      <svg id="tree-svg"></svg>
    </div>
    <div class="empty-hint" id="emptyHint">
      <p>Древо пока пустое. Начните с себя — добавьте своё имя, а дальше можно будет пристраивать родителей, супругов, детей, братьев и сестёр.</p>
      <button class="btn primary" id="btnStart">Начать с себя</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="application/json">
  <div id="zoomControls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">&minus;</button>
  </div>
</div>

<div id="modalRoot"></div>

/* =========================================================
   DATA MODEL
   ========================================================= */
let state = { people: {}, unions: {} };
let counter = 1;
function uid(prefix){ return prefix + (counter++); }

function newPerson(data){
  const p = Object.assign({
    id: uid('p'),
    firstName:'', lastName:'', middleName:'',
    gender:'', birthDate:'', deathDate:'',
    isUnknown:false,
    parentUnionId:null,
    spouseUnionIds:[],
    memories:[]
  }, data);
  state.people[p.id] = p;
  return p;
}
function newUnion(partner1Id, partner2Id){
  const u = { id: uid('u'), partner1Id: partner1Id||null, partner2Id: partner2Id||null, childrenIds:[] };
  state.unions[u.id] = u;
  return u;
}
function fullName(p){
  if(!p) return '?';
  if(p.isUnknown) return '?';
  return [p.lastName, p.firstName, p.middleName].filter(Boolean).join(' ') || '(без имени)';
}
function shortName(p){
  if(!p) return '?';
  if(p.isUnknown) return '?';
  return p.firstName || '(без имени)';
}

/* Create the very first person in an empty tree: auto-generates a
   placeholder "?"+"?" parent union underneath them. */
function createRootPerson(data){
  const self = newPerson(data);
  const unk1 = newPerson({isUnknown:true});
  const unk2 = newPerson({isUnknown:true});
  const parentUnion = newUnion(unk1.id, unk2.id);
  parentUnion.childrenIds.push(self.id);
  self.parentUnionId = parentUnion.id;
  return self;
}

/* Add a spouse to an existing person -> creates a new union */
function addSpouse(personId, data){
  const person = state.people[personId];
  const spouse = newPerson(data);
  const union = newUnion(personId, spouse.id);
  person.spouseUnionIds.push(union.id);
  spouse.spouseUnionIds.push(union.id);
  return {spouse, union};
}

/* Get or create a union to attach children to for a given person
   (if they have no spouse union yet, create one with unknown partner) */
function ensureOwnUnion(personId){
  const person = state.people[personId];
  if(person.spouseUnionIds.length>0) return state.unions[person.spouseUnionIds[0]];
  const unk = newPerson({isUnknown:true});
  const union = newUnion(personId, unk.id);
  person.spouseUnionIds.push(union.id);
  return union;
}

function addChildToUnion(unionId, data){
  const union = state.unions[unionId];
  const child = newPerson(data);
  child.parentUnionId = union.id;
  union.childrenIds.push(child.id);
  return child;
}

function addSibling(personId, data){
  const person = state.people[personId];
  if(!person.parentUnionId) return null;
  return addChildToUnion(person.parentUnionId, data);
}

function addParentsTo(personId){
  const person = state.people[personId];
  if(person.parentUnionId) return state.unions[person.parentUnionId];
  const unk1 = newPerson({isUnknown:true});
  const unk2 = newPerson({isUnknown:true});
  const union = newUnion(unk1.id, unk2.id);
  union.childrenIds.push(personId);
  person.parentUnionId = union.id;
  return union;
}

function fillUnknownPerson(personId, data){
  const p = state.people[personId];
  Object.assign(p, data, {isUnknown:false});
  return p;
}

function deletePersonCascadeCheck(personId){
  // not exposing deep deletion in MVP to avoid breaking references
}

/* =========================================================
   LAYOUT
   ========================================================= */
const LEAF_SPACING = 150;
const UNION_W = 130, UNION_H = 199;   // branch drawing size (matches branch asset aspect ratio)
const TRUNK_W = 232, TRUNK_H = 461;   // trunk is the sturdiest, largest element
const LEAF_W = 74, LEAF_H = 54;

// Column geometry: where along a branch/trunk image the vertical "growth column"
// actually sits (the asset has a short horizontal foot + curve before going vertical).
// Fractions are measured from the TOP of the image (0) down (1).
const COL_CENTER_OFFSET = 0.06;   // column sits slightly right of the image's horizontal center
const COL_SIDE_OFFSET = 0.15;     // how far left/right of the column a child attaches
const LEAF_ZONE = [0.06, 0.20];   // unmarried children (leaves) attach here — near the tip
const BRANCH_ZONE = [0.26, 0.36]; // children who married (become a new branch) attach here — mid-upper, so the new branch still visibly extends above its parent

// Where a branch's own "foot" (the cut log-end it attaches WITH) sits within its own
// image bounding box — measured from the actual artwork, used to physically dock the
// branch image onto its parent's attach point (not just draw a decorative line).
const FOOT_X_FRAC = 0.02;
const FOOT_Y_FRAC = 0.895;

const GROUND_Y_BASE = 3000; // arbitrary large "floor" the tree is anchored to; the SVG
                             // viewBox is cropped to the actual content afterwards.
const TREE_SPACING = 620;   // horizontal gap between independent (merged) forests

function distributeFracs(zone, count){
  const [a,b] = zone;
  if(count<=0) return [];
  if(count===1) return [(a+b)/2];
  const out = [];
  for(let i=0;i<count;i++) out.push(a + (b-a)*(i/(count-1)));
  return out;
}

function unionLevel(unionId, cache){
  cache = cache||{};
  if(cache[unionId]!=null) return cache[unionId];
  const u = state.unions[unionId];
  let lvl = 0;
  [u.partner1Id, u.partner2Id].forEach(pid=>{
    if(pid){
      const p = state.people[pid];
      if(p && p.parentUnionId){
        lvl = Math.max(lvl, unionLevel(p.parentUnionId, cache)+1);
      }
    }
  });
  cache[unionId] = lvl;
  return lvl;
}

function findForestRoots(){
  const cache = {};
  const roots = [];
  Object.values(state.unions).forEach(u=>{
    if(unionLevel(u.id, cache) === 0) roots.push(u.id);
  });
  return roots;
}

function splitChildren(unionId){
  const u = state.unions[unionId];
  const leafChildren = [];
  const branchChildNodes = [];
  u.childrenIds.forEach(cid=>{
    const c = state.people[cid];
    if(c.spouseUnionIds && c.spouseUnionIds.length>0){
      branchChildNodes.push({type:'union', id:c.spouseUnionIds[0], viaPersonId:cid});
    } else {
      leafChildren.push(cid);
    }
  });
  return {leafChildren, branchChildNodes};
}

// point along a stem at fraction `frac` of its height (0=near tip,1=near foot), offset
// to one side — this is where a child (leaf or branch) attaches
function stemPoint(imgX, imgY, w, h, frac, side){
  const stemCenterX = imgX + w/2 + w*COL_CENTER_OFFSET;
  return { x: stemCenterX + side*(w*COL_SIDE_OFFSET), y: imgY + h*frac };
}

// Recursively compute each node's actual pixel position, docking each branch child's
// image foot directly onto its parent's attach point (rather than just stacking levels).
function positionNode(node, level, opts, allNodes){
  const isTrunk = level===0;
  const w = isTrunk ? TRUNK_W : UNION_W;
  const h = isTrunk ? TRUNK_H : UNION_H;
  let imgX, imgY, mirror = false;
  if(!opts.parentAttach){
    imgX = opts.centerX - w/2;
    imgY = GROUND_Y_BASE - h;
  } else {
    const footXOffset = w*FOOT_X_FRAC;
    if(opts.side>=0){
      imgX = opts.parentAttach.x - footXOffset;
    } else {
      imgX = opts.parentAttach.x - w + footXOffset;
      mirror = true;
    }
    imgY = opts.parentAttach.y - h*FOOT_Y_FRAC;
  }
  node.imgX = imgX; node.imgY = imgY; node.w = w; node.h = h;
  node.mirror = mirror; node.level = level;
  node.x = imgX + w/2;

  const {leafChildren, branchChildNodes} = splitChildren(node.id);
  node.leafChildren = leafChildren;
  node.childNodes = branchChildNodes;
  allNodes.push(node);

  const branchFracs = distributeFracs(BRANCH_ZONE, branchChildNodes.length);
  branchChildNodes.forEach((cn, i)=>{
    const side = i%2===0 ? 1 : -1;
    const attach = stemPoint(imgX, imgY, w, h, branchFracs[i], side);
    positionNode(cn, level+1, {parentAttach: attach, side}, allNodes);
  });
}

function buildLayout(){
  const roots = findForestRoots();
  const allNodes = [];
  let xOffset = 300;
  roots.forEach(rootUnionId=>{
    const rootNode = {type:'union', id: rootUnionId};
    positionNode(rootNode, 0, {parentAttach:null, centerX:xOffset}, allNodes);
    xOffset += TREE_SPACING;
  });
  // isolated persons with no union at all (edge case after merges)
  Object.values(state.people).forEach(p=>{
    if(p.isUnknown) return;
    const inAnyUnionAsPartner = p.spouseUnionIds && p.spouseUnionIds.length>0;
    const isChildSomewhere = p.parentUnionId != null;
    if(!inAnyUnionAsPartner && !isChildSomewhere){
      const w=LEAF_W, h=LEAF_H;
      const node = {type:'leaf', id:p.id, level:0, x:xOffset, imgX:xOffset-w/2, imgY:GROUND_Y_BASE-h, w, h, isolated:true};
      xOffset += LEAF_SPACING + 30;
      allNodes.push(node);
    }
  });
  return {nodes: allNodes};
}

/* =========================================================
   RENDER
   ========================================================= */
const svg = document.getElementById('tree-svg');
const sceneWrap = document.getElementById('scene-wrap');
const scene = document.getElementById('scene');
const emptyHint = document.getElementById('emptyHint');
const btnAddRootTop = document.getElementById('btnAddRoot');

function hasAnyPeople(){
  return Object.values(state.people).some(p=>!p.isUnknown);
}

function render(){
  saveLocal();
  emptyHint.style.display = hasAnyPeople() ? 'none' : 'flex';
  btnAddRootTop.style.display = hasAnyPeople() ? 'none' : 'inline-block';
  svg.innerHTML = '';
  if(!hasAnyPeople()){
    svg.setAttribute('width', 10);
    svg.setAttribute('height', 10);
    return;
  }
  const layout = buildLayout();

  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- compute a tight bounding box around everything so the viewBox crops to content ----
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  layout.nodes.forEach(n=>{
    minX = Math.min(minX, n.imgX - 90); // extra margin for leaves that stick out sideways
    maxX = Math.max(maxX, n.imgX + n.w + 90);
    minY = Math.min(minY, n.imgY - 40);
    maxY = Math.max(maxY, n.imgY + n.h);
  });
  const margin = 40;
  minX -= margin; maxX += margin; minY -= margin; maxY += margin + 30;
  const svgWidth = Math.max(maxX-minX, sceneWrap.clientWidth);
  const svgHeight = maxY-minY;

  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);
  svg.setAttribute('viewBox', `${minX} ${minY} ${svgWidth} ${svgHeight}`);

  // nodes (single pass: draw the union/trunk image docked to its parent's attach point,
  // attach its leaf children near the tip, and draw connector curves to any branch
  // children — attached around the middle of the stem, evenly spread if several)
  layout.nodes.forEach(node=>{
    if(node.type==='union'){
      const u = state.unions[node.id];
      const p1 = state.people[u.partner1Id];
      const p2 = state.people[u.partner2Id];
      const isTrunk = node.level===0;
      const img = isTrunk ? IMG_TRUNK : IMG_BRANCH;
      const {imgX, imgY, w, h, mirror} = node;
      const labelY = imgY + h + 22;

      // --- connector curves to branch children ---
      const branchKids = node.childNodes || [];
      const branchFracs = distributeFracs(BRANCH_ZONE, branchKids.length);
      branchKids.forEach((cn, idx)=>{
        const side = idx%2===0 ? 1 : -1;
        const from = stemPoint(imgX, imgY, w, h, branchFracs[idx], side);
        const toY = cn.imgY + cn.h*FOOT_Y_FRAC;
        const toX = cn.mirror ? (cn.imgX + cn.w - cn.w*FOOT_X_FRAC) : (cn.imgX + cn.w*FOOT_X_FRAC);
        const midY = (from.y + toY)/2;
        const path = el('path', {
          d:`M ${from.x} ${from.y} C ${from.x} ${midY}, ${toX} ${midY}, ${toX} ${toY}`,
          class:'conn-line', style:'opacity:0.25;'
        });
        svg.appendChild(path);
      });

      // --- the branch/trunk image itself ---
      const g = el('g', {});
      const imgAttrs = {href: img, x:imgX, y:imgY, width:w, height:h, class:'node-img'};
      if(mirror){ imgAttrs.transform = `scale(-1,1) translate(${-(2*(imgX+w/2))},0)`; }
      const image = el('image', imgAttrs);
      image.addEventListener('click', ()=>openUnionModal(node.id));
      g.appendChild(image);
      const lastNames = [p1&&!p1.isUnknown?p1.lastName:null, p2&&!p2.isUnknown?p2.lastName:null].filter(Boolean);
      const surnameLabel = lastNames.length ? [...new Set(lastNames)].join(' / ') : '';
      const namesLabel = `${shortName(p1)} и ${shortName(p2)}`;
      const label = el('text', {x:node.x, y:labelY, class:'node-label'});
      label.textContent = surnameLabel ? `${surnameLabel} — ${namesLabel}` : namesLabel;
      label.addEventListener('click', ()=>openUnionModal(node.id));
      g.appendChild(label);
      svg.appendChild(g);

      // --- leaf children (unmarried) attach to the side, near the tip, above the branch children ---
      const leafKids = node.leafChildren || [];
      const leafFracs = distributeFracs(LEAF_ZONE, leafKids.length);
      leafKids.forEach((pid, idx)=>{
        const p = state.people[pid];
        const side = idx%2===0 ? 1 : -1;
        const attach = stemPoint(imgX, imgY, w, h, leafFracs[idx], side);
        const stemLen = 34;
        const lw = LEAF_W*0.78, lh = LEAF_H*0.78;
        const leafCx = attach.x + side*stemLen;
        const leafCy = attach.y - 8;
        const stemPath = el('path', {
          d:`M ${attach.x} ${attach.y} Q ${attach.x + side*stemLen*0.55} ${attach.y-8}, ${leafCx} ${leafCy}`,
          class:'conn-line'
        });
        svg.appendChild(stemPath);
        const limgX = leafCx - lw/2;
        const limgY = leafCy - lh/2;
        const limgAttrs = {href:IMG_LEAF, x:limgX, y:limgY, width:lw, height:lh, class:'node-img'};
        if(side<0){ limgAttrs.transform = `scale(-1,1) translate(${-(2*leafCx)},0)`; }
        const limg = el('image', limgAttrs);
        limg.addEventListener('click', ()=>openPersonModal(pid));
        svg.appendChild(limg);
        const llabel = el('text', {x:leafCx, y:leafCy+lh/2+15, class:'node-label leaf-label'});
        llabel.textContent = shortName(p);
        llabel.addEventListener('click', ()=>openPersonModal(pid));
        svg.appendChild(llabel);
      });
    } else {
      const p = state.people[node.id];
      const {imgX, imgY, w, h} = node;
      const image = el('image', {href:IMG_LEAF, x:imgX, y:imgY, width:w, height:h, class:'node-img'});
      image.addEventListener('click', ()=>openPersonModal(node.id));
      svg.appendChild(image);
      const label = el('text', {x:node.x, y:imgY+h+18, class:'node-label leaf-label'});
      label.textContent = shortName(p);
      label.addEventListener('click', ()=>openPersonModal(node.id));
      svg.appendChild(label);
    }
  });
}

let currentTab = 'main';

function openPersonModal(personId, initialTab){
  currentTab = initialTab || 'main';
  renderPersonModal(personId);
}

function renderPersonModal(personId){
  const p = state.people[personId];
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';

  const tabs = [
    {id:'main', label:'Основное'},
    {id:'spouse', label:'Супруг(а)'},
    {id:'children', label:'Дети'},
    {id:'parents', label:'Родители'},
    {id:'siblings', label:'Братья/сёстры'},
    {id:'memories', label:'Воспоминания'},
  ];

  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${p.isUnknown ? 'Неизвестный родственник' : (fullName(p)||'Новый человек')}</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="tabs">${tabs.map(t=>`<button class="tab-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>
      <div class="modal-body" id="modalBody"></div>
    </div>`;
  modalRoot.innerHTML='';
  modalRoot.appendChild(backdrop);
  backdrop.querySelector('.modal-close').onclick = closeModal;
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
  backdrop.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = ()=>{ currentTab = btn.dataset.tab; renderPersonModal(personId); };
  });

  const body = backdrop.querySelector('#modalBody');
  if(currentTab==='main') renderMainTab(body, p);
  if(currentTab==='spouse') renderSpouseTab(body, p);
  if(currentTab==='children') renderChildrenTab(body, p);
  if(currentTab==='parents') renderParentsTab(body, p);
  if(currentTab==='siblings') renderSiblingsTab(body, p);
  if(currentTab==='memories') renderMemoriesTab(body, p);
}

    </div>

    p.lastName = body.querySelector('#f_last').value.trim();
    p.firstName = body.querySelector('#f_first').value.trim();

    body.innerHTML = `
      <p class="hint-text">У этого человека пока нет отмеченного супруга/супруги.</p>
      <div class="field"><label>Фамилия супруга(и)</label><input id="s_last" value="${esc(p.lastName)}"></div>
      <div class="row2">
        <div class="field"><label>Имя</label><input id="s_first"></div>
        <div class="field"><label>Отчество</label><input id="s_mid"></div>
      </div>
      <div class="field"><label>Дата рождения</label><input id="s_birth" type="date"></div>
      <button class="btn primary" id="addSpouseBtn" style="width:100%;">Добавить супруга(у)</button>
    `;
    body.querySelector('#addSpouseBtn').onclick = ()=>{
      const data = {
        lastName: body.querySelector('#s_last').value.trim(),
        firstName: body.querySelector('#s_first').value.trim(),
        middleName: body.querySelector('#s_mid').value.trim(),
        birthDate: body.querySelector('#s_birth').value,
      };
      addSpouse(p.id, data);
      render();
      renderPersonModal(p.id);
    };
  } else {
    let html = '';
    p.spouseUnionIds.forEach(uid_=>{
      const u = state.unions[uid_];
      const spouseId = u.partner1Id===p.id ? u.partner2Id : u.partner1Id;
      const spouse = state.people[spouseId];
      html += `<div class="list-item" data-open="${spouse.id}" style="cursor:pointer;">
        <div class="info"><div class="name">${fullName(spouse)}</div><div class="sub">${spouse.birthDate||''}</div></div>
        <button class="mini-btn">Открыть</button>
      </div>`;
    });
    html += `<p class="hint-text">Можно указать ещё один брак, если это уместно для вашей семьи.</p>
      <button class="btn" id="addAnotherSpouse" style="width:100%;">Добавить ещё одного супруга</button>`;
    body.innerHTML = html;
    body.querySelectorAll('[data-open]').forEach(elm=>{
      elm.onclick = ()=>{ openPersonModal(elm.dataset.open); };
    });
    body.querySelector('#addAnotherSpouse').onclick = ()=>{
      const data = {lastName:p.lastName};
      addSpouse(p.id, data);
      render();
      renderPersonModal(p.id);
    };
  }
}

    const u = ensureOwnUnion(p.id);

    render();
    renderPersonModal(p.id);
  };

function renderSiblingsTab(body, p){
  if(!p.parentUnionId){
    body.innerHTML = `<p class="placeholder-msg">Сначала нужно, чтобы у этого человека были указаны родители (даже как «?»).</p>`;
    return;
  }
  const u = state.unions[p.parentUnionId];
  const siblings = u.childrenIds.filter(cid=>cid!==p.id);
  let html = '';
  if(siblings.length){
    siblings.forEach(sid=>{
      const s = state.people[sid];
      html += `<div class="list-item" data-open="${s.id}" style="cursor:pointer;">
        <div class="info"><div class="name">${fullName(s)}</div><div class="sub">${s.birthDate||''}</div></div>
        <button class="mini-btn">Открыть</button>
      </div>`;
    });
  } else {
    html += `<p class="hint-text">Братьев и сестёр пока не указано.</p>`;

    <button class="btn primary" id="addSibBtn" style="width:100%;">Добавить брата/сестру</button>

  body.innerHTML = html;
  body.querySelectorAll('[data-open]').forEach(elm=>{
    elm.onclick = ()=>{ openPersonModal(elm.dataset.open); };
  });
  body.querySelector('#addSibBtn').onclick = ()=>{
    const data = {
      lastName: body.querySelector('#sib_last').value.trim(),
      firstName: body.querySelector('#sib_first').value.trim(),
      middleName: body.querySelector('#sib_mid').value.trim(),
      birthDate: body.querySelector('#sib_birth').value,

    addSibling(p.id, data);

    renderPersonModal(p.id);

function renderMemoriesTab(body, p){
  let html = '';
  if(p.memories.length===0){
    html += `<p class="hint-text">Пока никто не оставил воспоминаний об этом человеке.</p>`;
  } else {
    p.memories.forEach((m,i)=>{
      html += `<div class="memory-item">
        <div class="meta">${esc(m.author||'Аноним')}${m.relation?' · '+esc(m.relation):''}</div>
        <div class="text">${esc(m.text)}</div>
      </div>`;
    });
  }
  html += `
    <div class="field" style="margin-top:10px;"><label>Ваше имя</label><input id="m_author"></div>
    <div class="field"><label>Кем вы приходитесь этому человеку</label><input id="m_relation" placeholder="например: внучка, племянник, друг семьи"></div>
    <div class="field"><label>Что вы помните об этом человеке</label><textarea id="m_text" placeholder="Каким он был, что вы помните, любые детали..."></textarea></div>
    <button class="btn primary" id="addMemoryBtn" style="width:100%;">Добавить запись</button>
  `;
  body.innerHTML = html;
  body.querySelector('#addMemoryBtn').onclick = ()=>{
    const text = body.querySelector('#m_text').value.trim();
    if(!text) return;
    p.memories.push({
      author: body.querySelector('#m_author').value.trim(),
      relation: body.querySelector('#m_relation').value.trim(),
      text
    });
    saveLocal();
    renderPersonModal(p.id);
  };
}

function esc(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

            <option value="m">Мужской</option>
            <option value="f">Женский</option>
          </select>
        </div>
        <div class="field"><label>Дата рождения</label><input id="r_birth" type="date"></div>
        <button class="btn primary" id="r_save" style="width:100%;">Создать древо</button>
      </div>
    </div>`;
  modalRoot.appendChild(backdrop);
  backdrop.querySelector('.modal-close').onclick = closeModal;
  backdrop.querySelector('#r_save').onclick = ()=>{
    const data = {
      lastName: backdrop.querySelector('#r_last').value.trim(),
      firstName: backdrop.querySelector('#r_first').value.trim(),
      middleName: backdrop.querySelector('#r_mid').value.trim(),
      gender: backdrop.querySelector('#r_gender').value,
      birthDate: backdrop.querySelector('#r_birth').value,
    };
    if(!data.firstName){ alert('Укажите хотя бы имя.'); return; }
    createRootPerson(data);
    closeModal();
    render();
  };
}

document.getElementById('btnStart').onclick = openCreateRootModal;
document.getElementById('btnAddRoot').onclick = openCreateRootModal;

/* =========================================================
   EXPORT / IMPORT / MERGE
   ========================================================= */
function exportFilename(){
  const stamp = new Date().toISOString().slice(0,10);
  return `semeynoe-drevo-${stamp}.json`;
}

function showExportFallback(payload, filename){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>Экспорт данных</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="hint-text">Автоматическое скачивание файла не сработало (это бывает в просмотре внутри чата). Скопируйте текст ниже и сохраните его в файл с именем <b>${esc(filename)}</b> — например, через заметки или файловый менеджер.</p>
        <textarea id="exportText" readonly style="min-height:220px;font-family:monospace;font-size:11px;">${esc(payload)}</textarea>
        <button class="btn primary" id="copyExportBtn" style="width:100%;margin-top:10px;">Скопировать текст</button>
      </div>
    </div>`;
  modalRoot.appendChild(backdrop);
  backdrop.querySelector('.modal-close').onclick = closeModal;
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
  backdrop.querySelector('#copyExportBtn').onclick = ()=>{
    const ta = backdrop.querySelector('#exportText');
    ta.select();
    ta.setSelectionRange(0, payload.length);
    let copied = false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(payload);
        copied = true;
      }
    }catch(e){}
    if(!copied){
      try{ document.execCommand('copy'); copied = true; }catch(e){}
    }
    backdrop.querySelector('#copyExportBtn').textContent = copied ? 'Скопировано ✓' : 'Выделите текст вручную и скопируйте';
  };
}

document.getElementById('btnExport').onclick = async ()=>{
  const payload = JSON.stringify({state, counter}, null, 2);
  const filename = exportFilename();
  const blob = new Blob([payload], {type:'application/json'});

  // On mobile, the native share sheet is the most reliable way to save/send a file,
  // and it also works inside restricted in-app browsers where downloads are blocked.
  try{
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Семейное древо'});
        return;
      }
    }
  }catch(e){
    // user cancelled share, or share failed — fall through to download attempt
    if(e && e.name === 'AbortError') return;
  }

  let downloadAttempted = false;
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    downloadAttempted = true;
  }catch(e){
    downloadAttempted = false;
  }

  // We can't reliably detect whether the download actually reached the user's
  // files (some in-app webviews silently no-op), so always offer the manual
  // copy fallback as a safety net a moment later.
  showExportFallback(payload, filename);
};

const fileInput = document.getElementById('fileInput');
document.getElementById('btnImport').onclick = ()=> fileInput.click();
fileInput.onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!hasAnyPeople()){
        state = imported.state;
        counter = imported.counter;
        render();
        alert('Древо загружено.');
      } else {
        const report = mergeImported(imported.state);
        render();
        alert(`Объединение завершено.\nСовпадающих людей найдено и объединено: ${report.merged}\nДобавлено новых людей: ${report.added}`);
      }
    }catch(err){
      alert('Не удалось прочитать файл: ' + err.message);
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
};

function normKey(p){
  return [p.lastName,p.firstName,p.middleName,p.birthDate].map(x=>(x||'').trim().toLowerCase()).join('|');
}

function mergeImported(importedState){
  const idMap = {};
  let merged = 0, added = 0;

  // Build lookup of existing real (non-unknown) people by key
  const existingByKey = {};
  Object.values(state.people).forEach(p=>{
    if(!p.isUnknown) existingByKey[normKey(p)] = p.id;
  });

  // Pass 1: people
  Object.values(importedState.people).forEach(ip=>{
    if(ip.isUnknown){
      const np = newPerson({isUnknown:true});
      idMap[ip.id] = np.id;
      return;
    }
    const key = normKey(ip);
    const existingId = key.replace(/\|+$/,'') && existingByKey[key];
    if(existingId){
      const ex = state.people[existingId];
      // fill blanks only
      ['lastName','firstName','middleName','gender','birthDate','deathDate'].forEach(f=>{
        if(!ex[f] && ip[f]) ex[f] = ip[f];
      });
      (ip.memories||[]).forEach(m=> ex.memories.push(m));
      idMap[ip.id] = existingId;
      merged++;
    } else {
      const np = newPerson(Object.assign({}, ip, {id:undefined, parentUnionId:null, spouseUnionIds:[], memories:(ip.memories||[]).slice()}));
      idMap[ip.id] = np.id;
      added++;
    }
  });

  // Pass 2: unions - remap and dedupe by partner pair
  const unionIdMap = {};
  const existingPairKey = {};
  Object.values(state.unions).forEach(u=>{
    existingPairKey[[u.partner1Id,u.partner2Id].sort().join('|')] = u.id;
  });

  Object.values(importedState.unions).forEach(iu=>{
    const np1 = idMap[iu.partner1Id] || null;
    const np2 = idMap[iu.partner2Id] || null;
    const pairKey = [np1,np2].sort().join('|');
    let localUnion;
    if(existingPairKey[pairKey]){
      localUnion = state.unions[existingPairKey[pairKey]];
    } else {
      localUnion = newUnion(np1, np2);
      existingPairKey[pairKey] = localUnion.id;
    }
    unionIdMap[iu.id] = localUnion.id;
  });

  // Pass 3: relink children/parentUnion/spouseUnions using maps
  Object.values(importedState.unions).forEach(iu=>{
    const localUnion = state.unions[unionIdMap[iu.id]];
    (iu.childrenIds||[]).forEach(cid=>{
      const localChildId = idMap[cid];
      if(localChildId && !localUnion.childrenIds.includes(localChildId)){
        localUnion.childrenIds.push(localChildId);
      }
      const childPerson = state.people[localChildId];
      if(childPerson && !childPerson.parentUnionId){
        childPerson.parentUnionId = localUnion.id;
      }
    });
  });
  Object.values(importedState.people).forEach(ip=>{
    const localId = idMap[ip.id];
    const localPerson = state.people[localId];
    (ip.spouseUnionIds||[]).forEach(iuid=>{
      const luid = unionIdMap[iuid];
      if(luid && !localPerson.spouseUnionIds.includes(luid)){
        localPerson.spouseUnionIds.push(luid);
      }
    });
  });

  return {merged, added};
}

/* =========================================================
   ZOOM (pinch-to-zoom + buttons + trackpad ctrl-wheel)
   ========================================================= */
let zoomScale = 1.25; // start a bit larger than 1:1
const ZOOM_MIN = 0.5, ZOOM_MAX = 3;

function applyZoom(){
  scene.style.transform = `scale(${zoomScale})`;
  scene.style.transformOrigin = '0 0';
}

function dist(t0, t1){
  const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

let pinchStartDist = null, pinchStartScale = null;
sceneWrap.addEventListener('touchstart', (e)=>{
  if(e.touches.length===2){
    pinchStartDist = dist(e.touches[0], e.touches[1]);
    pinchStartScale = zoomScale;
  }
}, {passive:true});
sceneWrap.addEventListener('touchmove', (e)=>{
  if(e.touches.length===2 && pinchStartDist){
    e.preventDefault();
    const d = dist(e.touches[0], e.touches[1]);
    let ns = pinchStartScale * (d / pinchStartDist);
    ns = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, ns));
    zoomScale = ns;
    applyZoom();
  }
}, {passive:false});
sceneWrap.addEventListener('touchend', (e)=>{
  if(e.touches.length<2){ pinchStartDist=null; pinchStartScale=null; }
});

sceneWrap.addEventListener('wheel', (e)=>{
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    zoomScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale - e.deltaY*0.01));
    applyZoom();
  }
}, {passive:false});

document.getElementById('zoomIn').onclick = ()=>{
  zoomScale = Math.min(ZOOM_MAX, zoomScale + 0.2);
  applyZoom();
};
document.getElementById('zoomOut').onclick = ()=>{
  zoomScale = Math.max(ZOOM_MIN, zoomScale - 0.2);
  applyZoom();
};

/* =========================================================
   AUTOSAVE (browser local storage) — export/import remain
   the way to transfer a file to someone else or make a backup
   ========================================================= */
const STORAGE_KEY = 'family-tree-data-v1';
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({state, counter}));
  }catch(e){ /* storage unavailable — silently ignore, export/import still works */ }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.state){
        state = parsed.state;
        counter = parsed.counter || 1;
        return true;
      }
    }
  }catch(e){ /* ignore */ }
  return false;
}
loadLocal();

/* =========================================================
   INIT
   ========================================================= */
render();
applyZoom();
window.addEventListener('resize', render);
</script>
